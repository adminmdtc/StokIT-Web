<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Stock — ระบบบริหารจัดการวัสดุ กลุ่มงานไอที</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

<!-- ==================== หน้าเข้าสู่ระบบ ==================== -->
<div id="login-view" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h1 class="login-title">IT Stock</h1>
    <p class="login-sub">ระบบบริหารจัดการวัสดุและอุปกรณ์<br>กลุ่มงานเทคโนโลยีสารสนเทศ</p>
    <form id="login-form">
      <div class="field">
        <label>ชื่อผู้ใช้</label>
        <input id="login-username" class="input" autocomplete="username" placeholder="ป้อนชื่อผู้ใช้" required>
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input id="login-password" type="password" class="input" autocomplete="current-password" placeholder="ป้อนรหัสผ่าน" required>
      </div>
      <div id="login-error" class="login-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
    </form>

  </div>
</div>

<!-- ==================== โครงสร้างแอป ==================== -->
<div id="app-view" class="app-layout hidden">

  <aside class="sidebar">
    <div class="brand">

      </div>
      <div>
        <div class="brand-name">IT Stock</div>

      </div>

        <span>รับเข้าวัสดุ</span>

      <a href="#/issue" data-route="issue" class="nav-item">

      <a href="#/stock" data-route="stock" class="nav-item">

        <span>ตั้งค่า</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <div class="avatar" id="sb-avatar">?</div>
        <div class="user-meta">

      <button class="link-reset" id="btn-reset">↺ รีเซ็ตข้อมูลตัวอย่าง</button>
    </div>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title"></h1>

      </div>
      <div class="topbar-right">

    </header>
    <main id="content" class="page"></main>
  </div>

</div>
