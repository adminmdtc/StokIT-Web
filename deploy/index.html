<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    /* updateViaCache:'none' = เช็ค sw.js กับเซิร์ฟเวอร์ทุกครั้ง ไม่ติด HTTP cache ของเบราว์เซอร์ */
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
      .then(reg => {
        console.log('Service Worker registered:', reg.scope);

        /* ตรวจอัปเดตทุกครั้งที่กลับมาที่แท็บ (แท็บที่ถูกพักไว้นาน ๆ เช่น iPad Safari/PWA) */
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') { try { reg.update().catch(() => {}); } catch (e) { /* ข้าม */ } }
        });

        /* SW ตัวใหม่ชาร์จหน้าอัตโนมัติ (ครั้งเดียว) — ไม่ต้องรอผู้ใช้รีเฟรชเอง
           แต่ถ้ากำลังเปิด modal/กรอกฟอร์มค้าง → แสดงแถบให้กดอัปเดตเอง กันข้อมูลที่กรอกหาย
           (แท็บที่ไม่เคยมี SW ควบคุม = ติดตั้งครั้งแรก ไม่ต้อง reload) */
        const hadController = !!navigator.serviceWorker.controller;
        let swRefreshing = false;
        window.__showUpdateBar = function () {
          if (document.getElementById('sw-update-bar')) return;
          const bar = document.createElement('div');
          bar.id = 'sw-update-bar';
          bar.innerHTML = '<span>มีเวอร์ชันใหม่ของระบบ — ถ้ายังกรอกรายการไม่เสร็จ บันทึกก่อนแล้วกดปุ่มด้านล่าง</span><button type="button" onclick="location.reload()">อัปเดตตอนนี้</button>';
          document.body.appendChild(bar);
        };
        window.__swApplyUpdate = function () {
          const busy = document.querySelector('#modal-root .modal') ||
            Array.from(document.querySelectorAll('.tx-row input, .tx-row select, .tx-row textarea')).some(el => (el.value || '').trim() !== '');
          if (busy) { window.__showUpdateBar(); return 'bar'; }
          location.reload();
          return 'reload';
        };
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (hadController && !swRefreshing) {
            swRefreshing = true;
            window.__swApplyUpdate();
          }
        });

        // ตรวจสอบ update
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'activated') {
              console.log('New Service Worker activated');
              // แจ้งเตือนผู้ใช้ (optional)
              if (typeof toast === 'function') {
                toast('มีเวอร์ชันใหม่ของระบบ — ถ้ากำลังกรอกรายการ ระบบจะไม่รีเฟรชจนกว่าจะพร้อม', 'info');
              }
            }
          });
        });
      })
      .catch(err => console.log('SW registration failed:', err));
  });
}

// แจ้งเตือนเมื่อ app พร้อมติดตั้ง (A2HS)
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('PWA install prompt available');
  // แสดงปุ่มติดตั้ง (optional)
  window.__showInstallPrompt = () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(choice => {
        console.log('Install choice:', choice.outcome);
        deferredPrompt = null;
      });
    }
  };
});

window.addEventListener('appinstalled', () => {
  console.log('IT Stock PWA installed');
  deferredPrompt = null;
});
</script>
